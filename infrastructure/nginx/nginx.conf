worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Do not serve runtime .env or secret files even if misplaced under html
  map $request_uri $blocked_secret_path {
    default 0;
    ~*\.env$ 1;
    ~*/\.git/ 1;
    ~*/runtime/ 1;
  }

  upstream envguard_backend {
    server 127.0.0.1:8080;
    keepalive 16;
  }

  # Redirect HTTP → HTTPS when certificates are present (EC2).
  # For pure local docker-compose on port 80, use the frontend container nginx instead.
  server {
    listen 80;
    server_name _;

    if ($blocked_secret_path) { return 404; }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/envguard;
    index index.html;

    if ($blocked_secret_path) { return 404; }

    location /api/ {
      proxy_pass http://envguard_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }

    # Never expose Spring Boot actuator/management publicly
    location /actuator {
      return 404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
