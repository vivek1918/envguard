<div class="auth">
  <div class="auth__panel">
    <div class="auth__brand">
      <span class="auth__mark" aria-hidden="true"></span>
      <h1>EnvGuard</h1>
      <p>Secure environment configuration approvals and deployments.</p>
    </div>

    <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()">
      <h2>{{ mode() === 'login' ? 'Sign in' : 'First-time setup' }}</h2>

      @if (error()) {
        <div class="form-error" role="alert">{{ error() }}</div>
      }

      <label>
        <span>Username</span>
        <input
          formControlName="username"
          autocomplete="username"
          [class.input--invalid]="fieldError('username')"
          [attr.aria-invalid]="!!fieldError('username')"
        />
        @if (fieldError('username'); as msg) {
          <span class="field-error">{{ msg }}</span>
        }
      </label>

      <label>
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-describedby]="mode() === 'register' ? 'password-hint' : null"
          [class.input--invalid]="fieldError('password')"
          [attr.aria-invalid]="!!fieldError('password')"
        />
        @if (mode() === 'register') {
          <span id="password-hint" class="field-hint">At least 8 characters</span>
        }
        @if (fieldError('password'); as msg) {
          <span class="field-error">{{ msg }}</span>
        }
      </label>

      @if (mode() === 'register') {
        <label>
          <span>Email</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            [class.input--invalid]="fieldError('email')"
            [attr.aria-invalid]="!!fieldError('email')"
          />
          @if (fieldError('email'); as msg) {
            <span class="field-error">{{ msg }}</span>
          }
        </label>
      }

      <button class="btn btn--primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Please wait…' : mode() === 'login' ? 'Sign in' : 'Create account' }}
      </button>

      <p class="auth__switch">
        @if (mode() === 'login') {
          First deploy?
          <button type="button" class="linkish" (click)="toggleMode()">Register</button>
        } @else {
          Already set up?
          <button type="button" class="linkish" (click)="toggleMode()">Sign in</button>
        }
      </p>
    </form>
  </div>
</div>
