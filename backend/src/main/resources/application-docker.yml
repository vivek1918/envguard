spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/envguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:envguard}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-db}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

envguard:
  aws:
    enabled: ${ENVGUARD_AWS_ENABLED:false}
    region: ${AWS_REGION:us-east-1}
  bootstrap:
    admin-user: ${ENVGUARD_BOOTSTRAP_ADMIN_USER:}
    admin-password: ${ENVGUARD_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-email: ${ENVGUARD_BOOTSTRAP_ADMIN_EMAIL:}

logging:
  level:
    com.envguard: INFO
