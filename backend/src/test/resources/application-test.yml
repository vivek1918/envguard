spring:
  datasource:
    url: jdbc:h2:mem:envguard_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  main:
    allow-bean-definition-overriding: true

envguard:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256!!
    expiration-ms: 3600000
  pipeline:
    token: test-pipeline-token-do-not-use-in-prod
  cors:
    allowed-origins: http://localhost:4200
  aws:
    enabled: false
    region: us-east-1
  approval:
    default-timeout-minutes: 60
  rate-limit:
    login-max-attempts: 100
    login-window-seconds: 60

logging:
  level:
    com.envguard: WARN
    org.hibernate: WARN
